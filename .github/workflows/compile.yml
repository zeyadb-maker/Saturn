name: Saturn native builds (fast)
concurrency:
  group: saturn-native-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: ["legacy"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            unzip make git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-jsoncpp
      - name: Build Saturn
        run: make -j$(nproc)
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: saturn-windows-build
          path: build/us_pc/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 libglew-dev libsdl2-dev \
            curl libcurl4-gnutls-dev libjsoncpp-dev
      - name: Build Saturn
        run: make -j"$(nproc)"
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: saturn-linux-build
          path: build/us_pc/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS native build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install glew sdl2 curl jsoncpp
      - name: Build Saturn
        run: |
          mkdir -p build/us_pc
          make CPP="clang -E -x c -P" -j"$(sysctl -n hw.ncpu)"
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: saturn-macos-build
          path: build/us_pc/
          if-no-files-found: error
          retention-days: 7
