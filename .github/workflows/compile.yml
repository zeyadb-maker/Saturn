name: Saturn native builds (fast)
concurrency:
  group: saturn-native-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: ["legacy"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            unzip make git python3
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-jsoncpp
      - name: Prepare generated output directories
        run: python3 tools/prepare_build_dirs.py
      - name: Build Saturn
        run: make -j$(nproc)
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: saturn-windows-build
          path: build/us_pc/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 libglew-dev libsdl2-dev \
            curl libcurl4-gnutls-dev libjsoncpp-dev
      - name: Prepare generated output directories
        run: python3 tools/prepare_build_dirs.py
      - name: Build Saturn
        run: make -j"$(nproc)"
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: saturn-linux-build
          path: build/us_pc/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS native build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install glew sdl2 curl jsoncpp
      - name: Build required tools
        run: |
          make -C tools textconv CC=clang
      - name: Prepare generated output directories
        run: python3 tools/prepare_build_dirs.py
      - name: Build Saturn
        run: |
          export CPATH="$(brew --prefix)/include${CPATH:+:$CPATH}"
          export CPLUS_INCLUDE_PATH="$(brew --prefix)/include${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}"
          make OSX_BUILD=1 CPP="clang -E -x c -P" -j"$(sysctl -n hw.ncpu)"
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: saturn-macos-build
          path: build/us_pc/
          if-no-files-found: error
          retention-days: 7

  ios-sdl2-framework:
    name: iOS SDL2 framework (Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build upstream SDL2 iOS framework
        run: |
          xcodebuild \
            -project external/SDL2/Xcode/SDL/SDL.xcodeproj \
            -scheme Framework-iOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/SDL2DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Upload SDL2 iOS framework
        uses: actions/upload-artifact@v4
        with:
          name: saturn-sdl2-ios-framework
          path: build/SDL2DerivedData/Build/Products/Release-iphoneos/SDL2.framework
          if-no-files-found: error
          retention-days: 7
