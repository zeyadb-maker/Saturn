name: iOS app build
on:
  push:
    branches: [legacy]
    paths:
      - "ios/**"
      - "src/**"
      - "actors/**"
      - "levels/**"
      - "bin/**"
      - "data/**"
      - "assets/**"
      - "external/SDL2"
      - ".gitmodules"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep iOS builds separate from the desktop/native CI concurrency group.
concurrency:
  group: saturn-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-app:
    name: Build Saturn iOS app and unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout Saturn and SDL2
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build SDL2 iOS framework
        run: |
          xcodebuild \
            -project external/SDL2/Xcode/SDL/SDL.xcodeproj \
            -scheme Framework-iOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/SDL2DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Prepare SDL2 include layout
        run: |
          mkdir -p build/SDL2Headers
          ln -s "$GITHUB_WORKSPACE/external/SDL2/include" build/SDL2Headers/SDL2

      - name: Generate required US text headers
        run: |
          make -C tools textconv
          mkdir -p build/us_pc/include
          tools/textconv charmap_menu.txt include/text_menu_strings.h.in build/us_pc/include/text_menu_strings.h
          tools/textconv charmap.txt include/text_options_strings.h.in build/us_pc/include/text_options_strings.h
          tools/textconv charmap.txt include/text_strings.h.in build/us_pc/include/text_strings.h

      - name: Generate Saturn iOS Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Build Saturn iOS app
        run: |
          xcodebuild \
            -project ios/SaturnIOS.xcodeproj \
            -scheme Saturn \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/SaturnDerivedData \
            -archivePath build/Saturn.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Saturn.xcarchive/Products/Applications/Saturn.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry ../../Saturn-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Saturn-iPhone-iPad-unsigned-ipa
          path: Saturn-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
